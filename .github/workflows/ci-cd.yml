name: Credit Scoring CI

on:
  push:
  pull_request:

jobs:
  test:
    name: Code Quality and Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Check formatting with Black
        run: |
          python -m black --check src tests

      - name: Check code with Flake8
        run: |
          python -m flake8 src tests

      - name: Validate data with Pandera
        run: |
          python -c "import pandas as pd; from src.data.validation import validate_data; validate_data(pd.read_csv('tests/fixtures/credit_sample.csv')); print('Data validation passed')"

      - name: Run unit tests
        run: |
          python -m pytest tests/ -v
